name: X4 Pro+ Build
on:
  push:
    branches: [x4-pro-plus, x4-pro-plus-build29, x4-pro-plus-build30]
  workflow_dispatch:
concurrency:
  group: x4-pro-plus-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  UV_CONSTRAINT: ${{ github.workspace }}/.github/pio-constraints.txt
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/pio-constraints.txt
jobs:
  build-x4pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: latest
          enable-cache: false
      - name: X4 Pro+ source smoke checks
        run: python scripts/x4pro_plus_smoke.py
      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.2.0.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"
      - name: X4 Pro+ host regression tests
        run: |
          cmake -S test -B test/build -DCMAKE_BUILD_TYPE=Release
          cmake --build test/build -j2
          ctest --test-dir test/build --output-on-failure
      - name: Build X4 Pro+
        run: pio run -e x4pro -j1
      - name: Package exact flash build
        run: |
          mkdir -p dist
          cp .pio/build/x4pro/firmware.bin dist/x4-pro-plus-firmware.bin
          cp .pio/build/x4pro/bootloader.bin dist/
          cp .pio/build/x4pro/partitions.bin dist/
          cp .pio/build/x4pro/firmware.elf dist/
          cp .pio/build/x4pro/firmware.map dist/
          cp docs/X4_PRO_PLUS_RELEASE_CHECKLIST.md dist/
          cp docs/X4_PRO_PLUS_FACTORY_RECOVERY.md dist/
          cp scripts/x4pro_plus_preflash.py dist/
          cp tools/x4pro_plus_phone_simulator.html dist/
          (cd dist && sha256sum bootloader.bin firmware.elf firmware.map partitions.bin x4-pro-plus-firmware.bin X4_PRO_PLUS_RELEASE_CHECKLIST.md X4_PRO_PLUS_FACTORY_RECOVERY.md x4pro_plus_preflash.py x4pro_plus_phone_simulator.html > SHA256SUMS.txt)
          {
            echo "X4 Pro+ build manifest"
            echo "commit=${GITHUB_SHA}"
            echo "target=x4pro"
            echo "board=ESP32-S3 XTEINK X4 Pro"
            echo "artifact=x4-pro-plus-x4pro"
            echo "app_flash_offset=0x00010000"
            echo "factory_restore_offset=0x00000000"
            echo "factory_backup_required=yes"
            echo "factory_backup_required_bytes=16777216"
            echo "physical_hardware_tested=no"
            echo "pdf_stock_parity_verified=no"
            echo "forced_rom_recovery_verified=no"
            echo "safe_to_flash=no"
            echo ""
            cat dist/SHA256SUMS.txt
          } > dist/BUILD_MANIFEST.txt
      - name: Verify packaged firmware
        run: |
          test -s dist/x4-pro-plus-firmware.bin
          test -s dist/bootloader.bin
          test -s dist/partitions.bin
          test -s dist/firmware.elf
          test -s dist/firmware.map
          test -s dist/X4_PRO_PLUS_RELEASE_CHECKLIST.md
          test -s dist/X4_PRO_PLUS_FACTORY_RECOVERY.md
          test -s dist/x4pro_plus_preflash.py
          test -s dist/x4pro_plus_phone_simulator.html
          grep -q '^safe_to_flash=no$' dist/BUILD_MANIFEST.txt
          grep -q '^pdf_stock_parity_verified=no$' dist/BUILD_MANIFEST.txt
          grep -q '^forced_rom_recovery_verified=no$' dist/BUILD_MANIFEST.txt
          python dist/x4pro_plus_preflash.py --help >/dev/null
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: x4-pro-plus-x4pro
          path: dist/
          if-no-files-found: error
