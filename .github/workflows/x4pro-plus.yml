name: X4 Pro+ Build
on:
  push:
    branches: [x4-pro-plus]
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_CONSTRAINT: ${{ github.workspace }}/.github/pio-constraints.txt
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/pio-constraints.txt
jobs:
  build-x4pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: latest
          enable-cache: false
      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.2.0.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: x4pro-plus-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: x4pro-plus-${{ runner.os }}-
      - name: Build X4 Pro+
        run: pio run -e x4pro -j1
      - name: Package exact flash build
        run: |
          mkdir -p dist
          cp .pio/build/x4pro/firmware.bin dist/x4-pro-plus-firmware.bin
          cp .pio/build/x4pro/bootloader.bin dist/
          cp .pio/build/x4pro/partitions.bin dist/
          cp .pio/build/x4pro/firmware.elf dist/
          cp .pio/build/x4pro/firmware.map dist/
          sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: x4-pro-plus-x4pro
          path: dist/
          if-no-files-found: error
