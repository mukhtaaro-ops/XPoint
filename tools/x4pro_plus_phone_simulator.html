<style>

<body>
<div id="viewport"><div id="screen"></div></div>
<script>
var S=document.getElementById("screen");
var state={
 screen:"home",stack:[],carousel:0,selectedBook:0,libraryTab:0,readerPage:0,readerMenu:false,

 mineMode:"DIG",mineStarted:false,mineFlags:{},mineOpen:{},mineWins:3,mineLosses:1,

var timer=null;
var books=[
 {title:"The Psychology of Money",author:"Morgan Housel",progress:"72% • 1h 18m",path:"/Books/Psychology of Money.epub"},
 {title:"Atomic Habits",author:"James Clear",progress:"84% • 32m",path:"/Books/Atomic Habits.epub"},
 {title:"Deep Work",author:"Cal Newport",progress:"55% • 2h 04m",path:"/Books/Deep Work.epub"},
 {title:"The Almanack",author:"Eric Jorgenson",progress:"61% • 1h 44m",path:"/Books/The Almanack.epub"},
 {title:"China Journal",author:"Mukhtaar",progress:"46% • 38m",path:"/Books/China Journal.txt"},
 {title:"Quran",author:"",progress:"38%",path:"/Books/Quran/Quran.epub"},
 {title:"FP&A Playbook",author:"Reference",progress:"17%",path:"/Books/FP&A Playbook.epub"},
 {title:"Designing Interfaces",author:"Reference",progress:"33%",path:"/Books/Designing Interfaces.epub"},
 {title:"Notes",author:"",progress:"21%",path:"/Books/Notes.txt"}

function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function status(){return '<div class="status"><span class="clock">21 Sep&nbsp;&nbsp;22:46</span><span class="battery"><span>77%</span><span class="bat"><i></i></span></span></div>'}
function header(title,search){return '<div class="header">'+status()+'<div class="title">'+esc(title)+'</div>'+(search?'<div class="searchIcon" data-act="search"></div>':'')+'</div>'}
function hints(a,b,c,d){return '<div class="hints"><div class="hint" data-act="back">'+(a||"")+'</div><div class="hint" data-act="select">'+(b||"")+'</div><div class="hint" data-act="up">'+(c||"")+'</div><div class="hint" data-act="down">'+(d||"")+'</div></div>'}
function push(screen,extra){state.stack.push({screen:state.screen,extra:extra||null});state.screen=screen;render()}
function back(){if(state.readerMenu){state.readerMenu=false;render();return}if(state.stack.length){var p=state.stack.pop();state.screen=p.screen;render()}else{state.screen="home";render()}}
function home(){
 var b=books[state.carousel],count=Math.min(5,books.length),left=(state.carousel+count-1)%count,right=(state.carousel+1)%count;
 var rows=["Browse Files","Library","Reading Stats","X4 Pro+","File Transfer","Settings"];
 var acts=["browser","library","stats","tools","transferNormal","settings"];
 var icons=["□","▤","▥","▦","⇄","⚙"];
 var menu="";
 for(var i=0;i<rows.length;i++) menu+='<div class="menuRow" style="top:'+(i*50)+'px" data-act="'+acts[i]+'"><span class="ico">'+icons[i]+'</span><span>'+rows[i]+'</span></div>';
 S.innerHTML='<div class="homeStatus"><span class="clock">21 Sep&nbsp;&nbsp;22:46</span><span class="battery"><span>77%</span><span class="bat"><i></i></span></span></div>'+
 '<div class="homeCarousel">'+
 '<div class="homeTitle">'+esc(b.title)+'</div>'+
 '<div class="cover" style="left:98px;top:79px;width:92px;height:146px" data-act="carouselPrev"><div class="coverTop">▯</div><div class="coverBottom"></div></div>'+
 '<div class="cover active" style="left:165px;top:44px;width:150px;height:208px" data-act="openCarousel"><div class="coverTop">▯</div><div class="coverBottom"></div></div>'+
 '<div class="cover" style="left:290px;top:79px;width:92px;height:146px" data-act="carouselNext"><div class="coverTop">▯</div><div class="coverBottom"></div></div>'+
 '<div class="homeProgress">'+esc(b.progress)+'</div><div class="dots">'+Array.from({length:count},function(_,i){return '<i class="dot '+(i===state.carousel?"on":"")+'"></i>'}).join("")+'</div></div>'+
 '<div class="homeMenu">'+menu+'</div>'+hints("RESUME","SELECT","↑","↓");
}
function standardMenu(title,labels,acts,icons){
 var body='<div class="menu" style="top:105px">';
 for(var i=0;i<labels.length;i++)body+='<div class="menuRow" style="top:'+(i*50)+'px" data-act="'+acts[i]+'"><span class="ico">'+(icons?icons[i]:"")+'</span><span>'+labels[i]+'</span></div>';
 body+='</div>';
 S.innerHTML=header(title,false)+body+hints("BACK","SELECT","↑","↓");
}
function tools(){
 standardMenu("X4 Pro+",["Library","Qur'an Reader","Study Cards","Prayer","Focus / Pomodoro","Games","Organizer","Utilities","Phone / PC Transfer"],
 ["library","quranFolder","study","prayer","focus","games","organizer","utilities","transfer"],["▤","▯","◆","◴","◷","▦","◫","▦","⇄"]);
}
function organizer(){standardMenu("Organizer",["Calendar","Tasks","Notes","Cards","Clippings"],["calendar","tasks","notes","cards","clippings"],["◫","✓","≡","◆","≡"])}

 var q=path||"/";
 var rows=q==="/Books/Quran"?[
  {n:"Quran.epub",sub:"EPUB",act:"openQuranBook"},{n:"Tafsir Notes.txt",sub:"TXT",act:"openQuranNotesFile"}
 ]:[
  {n:"Books",sub:"Folder",act:"booksFolder"},{n:"Quran",sub:"Folder",act:"quranFolder"},
  {n:"Psychology of Money.epub",sub:"EPUB",act:"openBook0"},{n:"China Journal.txt",sub:"TXT",act:"openBook4"},
  {n:"sample.xtc",sub:"XTC",act:"openXtc"}

 var html=header(q==="/"?"Browse Files":q,false)+'<div class="list" style="top:112px;bottom:48px">';
 for(var i=0;i<rows.length;i++)html+='<div class="listRow subtitle" data-act="'+rows[i].act+'"><span>'+esc(rows[i].n)+'<small>'+rows[i].sub+'</small></span><span class="right">›</span></div>';
 html+='</div>'+hints("BACK","OPEN","↑","↓");S.innerHTML=html;
}
function library(){
 var tabs=["Recent","Title","Author"];var html=header("Library",true)+'<div class="tabbar" style="position:absolute;top:89px;left:0;right:0">';
 for(var i=0;i<tabs.length;i++)html+='<div class="tab '+(i===state.libraryTab?"on":"")+'" data-act="libTab'+i+'">'+tabs[i]+'</div>';
 html+='</div><div class="grid">';
 for(var j=0;j<9;j++){var b=books[j];html+='<div class="bookCard" data-book="'+j+'"><span class="cue"></span><b>'+esc(b.title)+'</b><small>'+esc(b.author||"")+'</small></div>'}
 html+='</div><div class="readout">1/9 books</div>'+hints("BACK","OPEN","↑","↓");S.innerHTML=html;
}
var pages=[
 ["Chapter 7",["Wealth is what you don't see. Spending money to show people how much money you have is the fastest way to have less money.","The quiet part of building wealth is restraint. It is the difference between what you could spend and what you choose to keep.","Good decisions compound in the background long before they become visible."]],
 ["Chapter 8",["The highest form of wealth is the ability to wake up every morning and say: I can do whatever I want today.","Controlling your time is the highest dividend money pays. It gives you room to think, to choose, and to change direction.","The value of flexibility is difficult to measure until the day you need it."]],
 ["Chapter 9",["No one is impressed with your possessions as much as you are. People generally want respect and admiration from other people.","The paradox is that expensive things often attract attention to the thing itself, not to the person who owns it.","A durable life is built around choices that remain useful after the novelty disappears."]]
];
function reader(quran){
 var b=quran?books[5]:books[state.selectedBook];var p=pages[state.readerPage%pages.length];
 var body='<div class="readerPage"><h2>'+esc(quran?"سورة الفاتحة":p[0])+'</h2>';
 if(quran)body+='<p dir="rtl" style="font-size:27px;line-height:2;text-align:right">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ<br>الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ<br>الرَّحْمَٰنِ الرَّحِيمِ<br>مَالِكِ يَوْمِ الدِّينِ<br>إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ</p>';

 body+='<div class="readerStatus"><span>'+esc(b.title)+'</span><span>'+(state.readerPage+1)+' / 3</span></div></div>'+
 '<div class="turnZone left" data-act="pagePrev"></div><div class="menuZone" data-act="readerMenu"></div><div class="turnZone right" data-act="pageNext"></div>';

function keyboard(title,value,saveAct){
 var keys="QWERTYUIOPASDFGHJKLZXCVBNM".split("");var k="";

}
function mines(){
 var html=header("Minesweeper",false)+'<div style="position:absolute;top:111px;left:20px;right:20px;text-align:center;font-size:14px">Mines 8&nbsp;&nbsp;&nbsp; W '+state.mineWins+' / L '+state.mineLosses+'&nbsp;&nbsp;&nbsp; '+state.mineMode+'</div><div class="gameBoard mineBoard">';

function g2048(){

 }

function settings(){
 standardMenu("Settings",["Display","Reader","Buttons & touch","Wi-Fi & transfer","Library","Reading stats","Date & time","System"],
 ["noop","noop","noop","noop","noop","noop","noop","noop"],["▣","Aa","◉","⌁","▤","▥","◷","⚙"]);
}
function toast(t){var e=document.createElement("div");e.className="toast";e.textContent=t;S.appendChild(e);setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e)},1000)}
function render(){
 if(state.screen==="home")home();
 else if(state.screen==="tools")tools();
 else if(state.screen==="organizer")organizer();
 else if(state.screen==="utilities")utilities();
 else if(state.screen==="games")games();
 else if(state.screen==="browser")browser("/");
 else if(state.screen==="quranFolder")browser("/Books/Quran");
 else if(state.screen==="library")library();
 else if(state.screen==="reader")reader(false);
 else if(state.screen==="quranReader")reader(true);
 else if(state.screen==="contents")contents();
 else if(state.screen==="textMenu")textMenu();
 else if(state.screen==="moreMenu")moreMenu();
 else if(state.screen==="stats")stats();
 else if(state.screen==="study")study();
 else if(state.screen==="quranNotes")quranNotes();
 else if(state.screen==="clippings")clippings();
 else if(state.screen==="calendar")calendar();
 else if(state.screen==="tasks")tasks();
 else if(state.screen==="notes")notes();
 else if(state.screen==="cards")cards();
 else if(state.screen==="focus")focus();
 else if(state.screen==="prayer")prayer();
 else if(state.screen==="wallet")wallet();
 else if(state.screen==="calculator")calculator();
 else if(state.screen==="mines")mines();
 else if(state.screen==="g2048")g2048();
 else if(state.screen==="transfer")transfer(true);
 else if(state.screen==="transferNormal")transfer(false);
 else if(state.screen==="settings")settings();
 else home();
}
function go(name){state.stack.push({screen:state.screen});state.screen=name;render()}
function startFocus(){
 if(timer)clearInterval(timer);
 if(!state.focusRunning)return;
 timer=setInterval(function(){if(!state.focusRunning)return;if(state.focusSeconds>0)state.focusSeconds--;else{state.focusRunning=false;if(!state.focusBreak)state.focusSessions++;state.focusBreak=!state.focusBreak;state.focusSeconds=state.focusBreak?300:1500;clearInterval(timer)}if(state.screen==="focus")render()},1000)
}
function mineTap(i){
 if(state.mineMode==="FLAG"){state.mineFlags[i]=!state.mineFlags[i];render();return}
 if(!state.mineStarted)state.mineStarted=true;state.mineOpen[i]=true;render()
}
function new2048(){state.board2048=[0,0,0,0,0,2,0,0,0,0,0,0,0,0,2,0];state.score2048=0;render()}
function move2048(){state.score2048+=16;var a=state.board2048.filter(function(x){return x});while(a.length<16)a.push(0);state.board2048=a;render()}
S.addEventListener("click",function(ev){
 var card=ev.target.closest("[data-book]");if(card){state.selectedBook=parseInt(card.dataset.book,10);go("reader");return}
 var mine=ev.target.closest("[data-mine]");if(mine){mineTap(parseInt(mine.dataset.mine,10));return}
 var key=ev.target.closest("[data-key]");if(key){var k=key.dataset.key,v=S.dataset.edit||"";if(k==="backspace")v=v.slice(0,-1);else if(k==="done"){saveEditor();return}else v+=k;S.dataset.edit=v;var fld=document.getElementById("editField");if(fld)fld.textContent=v;return}
 var el=ev.target.closest("[data-act]");if(!el)return;var a=el.dataset.act;
 if(a==="back"){back();return}
 if(a==="carouselPrev"){state.carousel=(state.carousel+4)%5;render();return}
 if(a==="carouselNext"){state.carousel=(state.carousel+1)%5;render();return}
 if(a==="openCarousel"){state.selectedBook=state.carousel;go("reader");return}
 if(a==="browser"){go("browser");return}if(a==="booksFolder"){go("browser");return}if(a==="quranFolder"){go("quranFolder");return}
 if(a==="library"){go("library");return}if(a==="stats"||a==="bookStats"){go("stats");return}if(a==="tools"){go("tools");return}
 if(a==="settings"){go("settings");return}if(a==="transfer"){go("transfer");return}if(a==="transferNormal"){go("transferNormal");return}
 if(a==="study"){go("study");return}if(a==="prayer"){go("prayer");return}if(a==="focus"){go("focus");return}if(a==="games"){go("games");return}
 if(a==="organizer"){go("organizer");return}if(a==="utilities"){go("utilities");return}if(a==="wallet"){go("wallet");return}if(a==="calculator"){go("calculator");return}
 if(a==="quranNotes"){go("quranNotes");return}if(a==="clippings"){go("clippings");return}if(a==="calendar"){go("calendar");return}if(a==="tasks"){go("tasks");return}if(a==="notes"){go("notes");return}if(a==="cards"){go("cards");return}
 if(a==="mines"){go("mines");return}if(a==="g2048"){go("g2048");return}
 if(a==="openQuranBook"){go("quranReader");return}if(a==="openQuranNotesFile"){go("notes");return}
 if(a==="openBook0"){state.selectedBook=0;go("reader");return}if(a==="openBook4"){state.selectedBook=4;go("reader");return}if(a==="openXtc"){state.selectedBook=8;go("reader");return}
 if(a==="readerMenu"){state.readerMenu=!state.readerMenu;render();return}if(a==="pagePrev"){state.readerPage=Math.max(0,state.readerPage-1);render();return}if(a==="pageNext"){state.readerPage=Math.min(2,state.readerPage+1);render();return}
 if(a==="contents"){state.readerMenu=false;go("contents");return}if(a==="textMenu"){state.readerMenu=false;go("textMenu");return}if(a==="moreMenu"){state.readerMenu=false;go("moreMenu");return}
 if(a==="bookmark"){toast("Bookmark saved");return}if(a==="clip"){toast("Clipping saved");return}
 if(a.indexOf("libTab")===0){state.libraryTab=parseInt(a.slice(6),10);render();return}
 if(a==="search"){keyboard("Search library","", "search");return}
 if(a==="focusToggle"){state.focusRunning=!state.focusRunning;startFocus();render();return}
 if(a==="focus25"){state.focusSeconds=1500;state.focusBreak=false;state.focusRunning=true;startFocus();render();return}
 if(a==="focus5"){state.focusSeconds=300;state.focusBreak=true;state.focusRunning=true;startFocus();render();return}
 if(a==="focusReset"){state.focusSeconds=1500;state.focusBreak=false;state.focusRunning=false;if(timer)clearInterval(timer);render();return}
 if(a==="prayerEdit"){keyboard("Prayer settings","-26.2041,28.0473,120,18,17,1","prayer");return}
 if(a.indexOf("walletShow")===0){qrDisplay(state.wallet[parseInt(a.slice(10),10)]);return}
 if(a==="walletAdd"){keyboard("Add QR / pass payload","", "wallet");return}
 if(a==="calcAdd"){keyboard("Enter calculation","", "calc");return}
 if(a.indexOf("calcEdit")===0){var cv=state.calcHistory[parseInt(a.slice(8),10)].split(" = ")[0];keyboard("Enter calculation",cv,"calc");return}
 if(a.indexOf("studyItem")===0){state.studyReveal=parseInt(a.slice(9),10);toast(["A: Earnings before interest and tax","A: To absorb remaining costs","A: Chengdu evening walk"][state.studyReveal]||"");return}
 if(a==="studyAdd"){keyboard("Question :: Answer","", "study");return}
 if(a==="qnoteAdd"||a==="cliplistAdd"||a==="calendarAdd"||a==="taskAdd"||a==="noteAdd"||a==="cardAdd"){keyboard("Add item","",a);return}
 if(a==="mineNew"){state.mineStarted=false;state.mineOpen={};state.mineFlags={};render();return}if(a==="mineMode"){state.mineMode=state.mineMode==="DIG"?"FLAG":"DIG";render();return}
 if(a==="2048New"){new2048();return}
 if(a==="noop"){return}
});
function saveEditor(){
 var v=S.dataset.edit||"",act=S.dataset.saveAct||"";
 if(act==="wallet"&&v)state.wallet.push(v);
 if(act==="calc"&&v){var result;try{result=Function('"use strict";return ('+v+')')()}catch(e){result="Error"}state.calcHistory.push(v+" = "+result)}
 S.dataset.edit="";S.dataset.saveAct="";back()
}
var sx=0,sy=0;
S.addEventListener("touchstart",function(e){if(e.touches.length){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
S.addEventListener("touchend",function(e){if(state.screen!=="g2048"||!e.changedTouches.length)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>35)move2048()},{passive:true});
function fit(){
 var scale=Math.min(window.innerWidth/480,window.innerHeight/800);
 S.style.transform="scale("+scale+")";
 S.style.left=((window.innerWidth-480*scale)/2)+"px";
 S.style.top=((window.innerHeight-800*scale)/2)+"px";
}
window.addEventListener("resize",fit);fit();render();
</script>
